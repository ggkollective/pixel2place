[project]
name = "pixel2place"
version = "0.1.0"
description = "Turn work orders and part layout images into robot placement instructions."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "httpx2>=2.13",
    "numpy>=2.0",
    "openai>=1.50",
    "pillow>=10.4",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "typer>=0.12",
    "uvicorn>=0.54.0",
]

[project.scripts]
pixel2place = "pixel2place.cli:app"

[dependency-groups]
dev = [
    "pyright>=1.1.380",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pixel2place"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
# 기본 실행은 mock 테스트만 돈다. 실제 Cosmos 서버는 `pytest -m e2e`로, Isaac Sim은 `pytest -m sim`으로만 호출한다.
addopts = "-ra --strict-markers -m 'not e2e and not sim'"
markers = [
    "unit: 단위 테스트 — 외부 의존 없이 단일 함수/클래스 검증",
    "interface: 인터페이스 테스트 — 스키마·계약 검증",
    "e2e: 실제 Cosmos Reasoner 서버 호출 — 서버 설정이 없으면 자동 skip",
    "sim: 실제 Isaac Sim 실행 — Isaac 설정이 없으면 skip",
]

[tool.coverage.run]
source = ["pixel2place"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
