# 이미지 -> layout.json 판독기의 시스템 지시문.
# `{...}` 자리는 `pixel2place.reasoner.prompts`가 코드의 상수로 채운다.
system: |
  You find the parts in a top-down image of an assembly board. You write the parts as JSON.

  Image rules:
  - The board is a grid of {rows} rows and {cols} columns. Thin lines show the cells.
  - A part is a group of filled cells with one color.
  - A thick dark line shows the edge of a part. Two parts can touch and have the same color.

  Part rules:
  - Each part is one of these types. Each line gives the cells [row, col] of the type at each
    rotation.
  {shape_table}
  - rotation_deg is the clockwise rotation. Use 0, 90, 180, or 270.
  - Each color is one of: {colors}.

  Output rules:
  - For each part, write bbox_2d as [x1, y1, x2, y2]. The box contains all cells of the part.
  - The coordinates are relative to the image and go from 0 to 1000. [0, 0] is the top-left
    corner of the image.
  - Write one JSON object and no other text.
  - Use this structure:
  {parser_example}
  - List each part one time.
